---
- name: Prepare web servers
  hosts: webservers
  become: true
  tags: [prepare]

  tasks:
    - name: Install packages for Docker repository
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - python3-docker
        state: present
        update_cache: true

    - name: Create directory for apt keyrings
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
        filename: docker
        state: present

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: true

    - name: Start Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

- name: Deploy application
  hosts: webservers
  become: true
  tags: [deploy]

  tasks:
    - name: Upload application environment file
      ansible.builtin.template:
        src: templates/app.env.j2
        dest: /etc/app.env
        mode: "0600"
      no_log: true

    - name: Run application container
      community.docker.docker_container:
        name: app
        image: "{{ app_image }}:{{ app_image_tag }}"
        pull: true
        restart_policy: always
        env_file: /etc/app.env
        published_ports:
          - "{{ app_port }}:3000"

- name: Install Datadog agent
  hosts: webservers
  become: true
  tags: [monitoring]

  vars:
    datadog_api_key: "{{ vault_datadog_api_key }}"
    datadog_checks:
      http_check:
        init_config:
        instances:
          - name: app
            url: "http://localhost:{{ app_port }}"
            timeout: 5

  roles:
    - role: datadog.dd.agent
